            for(int i=0;i<5;i++){
              juce::AudioProcessorParameter* p=nullptr;
              int matches=0;
              for(auto* candidate:original.getParameters())
                if((dynamic_cast<juce::AudioProcessorParameterWithID*>(candidate)!=nullptr && dynamic_cast<juce::AudioProcessorParameterWithID*>(candidate)->paramID==ids[i])){p=candidate;++matches;}
              assert(matches==1);
              assert(p!=nullptr && dynamic_cast<juce::AudioProcessorParameterWithID*>(p)!=nullptr);
              auto* ranged=dynamic_cast<juce::RangedAudioParameter*>(p);
              assert(ranged!=nullptr);
              ranged->setValueNotifyingHost(ranged->convertTo0to1(values[i]));
            }
            juce::MemoryBlock state;
            original.getStateInformation(state);
            assert(state.getSize()>0);
            restored.setStateInformation(state.getData(),static_cast<int>(state.getSize()));
            for(int i=0;i<5;i++){
              juce::RangedAudioParameter* ranged=nullptr;
              for(auto* candidate:restored.getParameters())
                if((dynamic_cast<juce::AudioProcessorParameterWithID*>(candidate)!=nullptr && dynamic_cast<juce::AudioProcessorParameterWithID*>(candidate)->paramID==ids[i]))
                  ranged=dynamic_cast<juce::RangedAudioParameter*>(candidate);
              assert(ranged!=nullptr);
              assert(std::abs(ranged->convertFrom0to1(ranged->getValue())-values[i])<0.001f);
            }
            // Regression: the plugin must generate nonzero stereo audio from
            // host MIDI without opening its WebView or pressing Start Audio.
            // Isolate the DSP itself from the JUCE MIDI/processor path.
            liberty::FreedomDSP standaloneDsp;
            standaloneDsp.prepare(48000.0);
            liberty::FreedomDSP::Parameters diagnosticParams{};
            diagnosticParams.masterGain=0.5f;
            diagnosticParams.attackSeconds=0.01f;
            diagnosticParams.decaySeconds=0.15f;
            diagnosticParams.sustain=0.7f;
            diagnosticParams.releaseSeconds=0.25f;
            diagnosticParams.cutoffHz=12000.0f;
            diagnosticParams.osc[0].enabled=true;
            diagnosticParams.osc[0].level=0.5f;
            standaloneDsp.setParameters(diagnosticParams);
            standaloneDsp.noteOn(0,60,110);
            float probeL[512]{},probeR[512]{};
            standaloneDsp.process(probeL,probeR,512);
            double dspPeak=0.0;
            for(float sample:probeL)dspPeak=std::max(dspPeak,(double)std::abs(sample));
            std::cout<<"Direct native DSP peak: "<<dspPeak<<std::endl;
            Freedom2Processor instrument;
            instrument.prepareToPlay(48000.0,512);
            // Inspect actual APVTS defaults used by the host processor.
            for(const char* id:{"master","attack","decay","sustain","cutoff","osc1On","osc1Level","osc2On","osc2Level","osc3On","osc3Level"}) {
              const auto* value=instrument.getValueTreeState().getRawParameterValue(id);
              std::cout<<"Host DSP parameter "<<id<<" = "<<(value?value->load():-999.0f)<<std::endl;
            }
            juce::AudioBuffer<float> audio(2,512);
            juce::MidiBuffer notes;
            notes.addEvent(juce::MidiMessage::noteOn(1,60,(juce::uint8)110),0);
            std::cout<<"MIDI events before processBlock: "<<notes.getNumEvents()<<std::endl;
            // Verify the actual native oscillator and envelope parameter contract.
            for(const char* id:{"filterEnvAttack","filterEnvDecay","filterEnvSustain","filterEnvRelease","filterEnvAmount","filterMode","chorusOn","driveOn"}) {
              const auto* value=instrument.getValueTreeState().getRawParameterValue(id);
              std::cout<<"Host DSP parameter "<<id<<" = "<<(value?value->load():-999.0f)<<std::endl;
            }
            double peak=0.0;
            for(int block=0;block<12;++block){
              audio.clear();
              instrument.processBlock(audio,notes);
              for(int ch=0;ch<2;++ch)
                for(int n=0;n<audio.getNumSamples();++n)
                  peak=std::max(peak,(double)std::abs(audio.getSample(ch,n)));
              notes.clear();
            }
            std::cout<<"Native MIDI render measured peak: "<<peak<<std::endl;
            if(!(std::isfinite(peak) && peak>0.00001)) {
              std::cerr<<"SILENT DSP: host MIDI render produced no audible samples"<<std::endl;
              return 2;
            }
            // Critical audible-regression test: parameters MUST alter rendered audio.
            auto renderPatch=[&](int wave,float cutoff,float level,int oscillator=1){
              Freedom2Processor synth;
              synth.prepareToPlay(48000.0,512);
              auto setPhysical=[&](const char* id,float value){
                auto* p=synth.getValueTreeState().getParameter(id);
                assert(p!=nullptr);
                p->setValueNotifyingHost(p->convertTo0to1(value));
              };
              setPhysical("osc1Wave",(float)wave);
              setPhysical("osc1Level",oscillator==1?level:0.0f);
              setPhysical("osc2Level",oscillator==2?level:0.0f);
              setPhysical("osc3Level",oscillator==3?level:0.0f);
              setPhysical("osc1On",oscillator==1?1.0f:0.0f);
              setPhysical("osc2On",oscillator==2?1.0f:0.0f);
              setPhysical("osc3On",oscillator==3?1.0f:0.0f);
              setPhysical("osc2Wave",(float)wave);
              setPhysical("osc3Wave",(float)wave);
              setPhysical("cutoff",cutoff);
              juce::AudioBuffer<float> out(2,512);
              juce::MidiBuffer midi;
              midi.addEvent(juce::MidiMessage::noteOn(1,60,(juce::uint8)110),0);
              std::vector<float> samples;
              for(int b=0;b<8;++b){
                out.clear();synth.processBlock(out,midi);midi.clear();
                if(b>=2)for(int n=0;n<512;++n)samples.push_back(out.getSample(0,n));
              }
              synth.releaseResources();
              return samples;
            };
            const auto saw=renderPatch(0,14000.f,0.7f);
            const auto square=renderPatch(1,14000.f,0.7f);
            const auto muted=renderPatch(0,14000.f,0.f);
            const auto filtered=renderPatch(0,300.f,0.7f);
            auto difference=[](const auto& a,const auto& b){
              assert(a.size()==b.size());double sum=0;
              for(size_t i=0;i<a.size();++i)sum+=std::abs((double)a[i]-b[i]);
              return sum/a.size();
            };
            const auto osc2=renderPatch(0,14000.f,0.7f,2);
            const auto osc3=renderPatch(0,14000.f,0.7f,3);
            const auto osc2Square=renderPatch(1,14000.f,0.7f,2);
            const auto osc3Square=renderPatch(1,14000.f,0.7f,3);
            auto rms=[](const auto& v){double sum=0;for(float x:v)sum+=double(x)*x;return std::sqrt(sum/v.size());};
            const double osc2Rms=rms(osc2),osc3Rms=rms(osc3);
            const double osc2WaveDiff=difference(osc2,osc2Square);
            const double osc3WaveDiff=difference(osc3,osc3Square);
            std::cout<<"OSCILLATOR ISOLATION osc2RMS="<<osc2Rms<<" osc3RMS="<<osc3Rms
                     <<" osc2WaveDiff="<<osc2WaveDiff<<" osc3WaveDiff="<<osc3WaveDiff<<std::endl;
            if(osc2Rms<0.0001||osc3Rms<0.0001||osc2WaveDiff<0.0001||osc3WaveDiff<0.0001){
              std::cerr<<"FAIL: isolated OSC2/OSC3 audio or waveform response"<<std::endl;
              return 4;
            }
            const double waveDiff=difference(saw,square);
            const double levelDiff=difference(saw,muted);
            const double filterDiff=difference(saw,filtered);
            std::cout<<"AUDIBLE PARAMETER DIFFERENCE wave="<<waveDiff
                     <<" level="<<levelDiff<<" cutoff="<<filterDiff<<std::endl;
            if(waveDiff<0.0001||levelDiff<0.0001||filterDiff<0.0001){
              std::cerr<<"FAIL: Freedom 2 produces the same audio across different patches"<<std::endl;
              return 3;
            }
            instrument.releaseResources();
            std::cout<<"Freedom2 native host MIDI -> stereo audio peak: "<<peak<<std::endl;
            std::cout<<"Real Freedom2Processor ADSR host state roundtrip passed\n";
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["SOURCE_ROOT"])/"plugin"
          header=(root/"Source/PluginProcessor.h").read_text()
          # JUCE's public processor parameter list is sufficient; no
          # access to the private APVTS or production header changes required.
          assert "getStateInformation" in header and "setStateInformation" in header
          PY
          echo "Native test source prepared; linking against JUCE plugin implementation follows."
      - name: Register native processor state test with CMake
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["SOURCE_ROOT"])/"plugin"
          cmake=root/"CMakeLists.txt"
          content=cmake.read_text()
          match=re.search(r'juce_add_plugin\s*\(\s*([^\s)]+)',content)
          assert match,"Unable to locate JUCE plugin target"
          target=match.group(1)
          test=Path(os.environ["RUNNER_TEMP"])/"freedom-processor-test/main.cpp"
          assert test.exists()
          content += f"""
          add_executable(freedom_processor_state_test "{test}")
          target_include_directories(freedom_processor_state_test PRIVATE "{root}/Source")
          target_link_libraries(freedom_processor_state_test PRIVATE
              {target} juce::juce_audio_utils juce::juce_audio_processors)
          target_include_directories(freedom_processor_state_test PRIVATE
              "$<TARGET_PROPERTY:{target},JUCE_GENERATED_SOURCES_DIRECTORY>"
              "$<TARGET_PROPERTY:{target},INCLUDE_DIRECTORIES>")
          target_compile_features(freedom_processor_state_test PRIVATE cxx_std_17)
          target_compile_options(freedom_processor_state_test PRIVATE -UNDEBUG)
          """
          cmake.write_text(content)
          print("Registered real processor integration test against",target)
          PY
      - name: Configure ARM64
        shell: bash
        run: |
          cmake -S "$SOURCE_ROOT/plugin" -B "$RUNNER_TEMP/freedom-build" -G Xcode \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_FLAGS="-DJUCE_FORCE_USE_LEGACY_PARAM_IDS=1"
      - name: Build AU VST3 Standalone
        shell: bash
        run: cmake --build "$RUNNER_TEMP/freedom-build" --config Release --parallel 3
      - name: Build and run real processor state test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/freedom-build" --config Release --target freedom_processor_state_test --parallel 3
          "$RUNNER_TEMP/freedom-build/Release/freedom_processor_state_test"
      - name: Verify compiled AU VST3 filter ADSR parameter identifiers
        shell: bash
        run: |
          set -euo pipefail
          for extension in component vst3; do
            bundle=$(find "$RUNNER_TEMP/freedom-build" -type d -name "Freedom 2.$extension" -print -quit)
            test -n "$bundle"
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            test -f "$binary"
            strings "$binary" > "$RUNNER_TEMP/freedom-$extension-strings.txt"
            for parameter in filterEnvAttack filterEnvDecay filterEnvSustain filterEnvRelease filterEnvAmount; do
              if ! grep -Fq "$parameter" "$RUNNER_TEMP/freedom-$extension-strings.txt"; then
                echo "::error::Missing $parameter in compiled $extension plugin"
                exit 1
              fi
            done
            echo "$extension: five native filter ADSR parameter identifiers present in compiled binary"
          done
      - name: Verify compiled AU instrument metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find "$RUNNER_TEMP/freedom-build" -type d -name 'Freedom 2.component' -print -quit)
          test -n "$bundle"
          plist="$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist" | grep -Fx 'aumu'
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist"
      - name: Collect plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$RUNNER_TEMP/freedom-build" -type d \( -name 'Freedom 2.component' -o -name 'Freedom 2.vst3' -o -name 'Freedom 2.app' \) -prune -print | while IFS= read -r item; do
            cp -R "$item" dist/
          done
          ls -lah dist
          test -d "dist/Freedom 2.component"
          test -d "dist/Freedom 2.vst3"
          for item in dist/*; do codesign --force --deep --sign - "$item"; done
          # Validate both plugin bundles before publishing the artifact.
          for bundle in "dist/Freedom 2.component" "dist/Freedom 2.vst3"; do
            test -f "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$bundle/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            test -f "$bundle/Contents/MacOS/$executable"
            file "$bundle/Contents/MacOS/$executable" | grep -q 'arm64'
          done
          # Both distribution formats must expose a stable, non-empty bundle ID.
          au_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'dist/Freedom 2.component/Contents/Info.plist')
          vst_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'dist/Freedom 2.vst3/Contents/Info.plist')
          test -n "$au_id"
          test -n "$vst_id"
          # JUCE may use the same CFBundleIdentifier for AU and VST3; both must be present.
          echo "AU bundle ID: $au_id"
          echo "VST3 bundle ID: $vst_id"
          # Both installed formats must report the same product version.
          au_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Freedom 2.component/Contents/Info.plist')
          vst_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Freedom 2.vst3/Contents/Info.plist')
          test -n "$au_version"
          test "$au_version" = "$vst_version"
          echo "AU/VST3 shared version: $au_version"
          # JUCE must advertise this plugin as an instrument accepting host MIDI.
          grep -Eq 'IS_SYNTH[[:space:]]+TRUE' "$SOURCE_ROOT/plugin/CMakeLists.txt"
          grep -Eq 'NEEDS_MIDI_INPUT[[:space:]]+TRUE' "$SOURCE_ROOT/plugin/CMakeLists.txt"
          echo "AU/VST3 signatures, ARM64 binaries and native MIDI flags validated"
          ditto -c -k --sequesterRsrc --keepParent dist Freedom-2-macOS-ARM64.zip
          # Verify the published ZIP can be read and contains both plugin formats.
          unzip -tq Freedom-2-macOS-ARM64.zip
          unzip -Z1 Freedom-2-macOS-ARM64.zip | grep -Fq 'Freedom 2.component/Contents/Info.plist'
          unzip -Z1 Freedom-2-macOS-ARM64.zip | grep -Fq 'Freedom 2.vst3/Contents/Info.plist'
          echo "Distribution ZIP integrity and AU/VST3 contents verified"
          # Round-trip the archive and compare the actual bundle metadata byte-for-byte.
          mkdir -p "$RUNNER_TEMP/freedom-zip-check"
          ditto -x -k Freedom-2-macOS-ARM64.zip "$RUNNER_TEMP/freedom-zip-check"
          for format in component vst3; do
            original="dist/Freedom 2.$format/Contents/Info.plist"
            restored="$RUNNER_TEMP/freedom-zip-check/dist/Freedom 2.$format/Contents/Info.plist"
            test -f "$restored"
            cmp "$original" "$restored"
          done
          echo "Distribution ZIP extraction and AU/VST3 plist round-trip verified"
          # Confirm the extracted bundles contain real, nonempty Mach-O binaries.
          for format in component vst3; do
            bundle="$RUNNER_TEMP/freedom-zip-check/dist/Freedom 2.$format"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            test -s "$binary"
            file "$binary" | grep -q 'Mach-O'
            # The macOS ARM64 release must include an Apple Silicon slice.
            lipo "$binary" -verify_arch arm64
            original_binary="dist/Freedom 2.$format/Contents/MacOS/$executable"
            cmp "$original_binary" "$binary"
            # The delivered bundle must retain a valid macOS code signature.
            codesign --verify --strict "$bundle"
            # Confirm the extracted executable is covered by the bundle signature.
            codesign --verify --strict --verbose=2 "$binary"
          done
          echo "Extracted AU and VST3 executables verified"
      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-2-macOS-ARM64
          path: Freedom-2-macOS-ARM64.zip
          retention-days: 7
