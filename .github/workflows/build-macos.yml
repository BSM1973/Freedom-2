name: Freedom 2 - macOS AU VST3 Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'Freedom_2_UI_v8.8.zip'
      - 'scripts/prepare_original_ui.py'
      - 'scripts/add_filter_adsr.py'
permissions:
  contents: read
concurrency:
  group: freedom2-macos
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Freedom_2_UI_v8.8.zip ]; then
            unzip -q Freedom_2_UI_v8.8.zip -d "$RUNNER_TEMP/freedom-src"
            echo "SOURCE_ROOT=$RUNNER_TEMP/freedom-src/freedom2_v88" >> "$GITHUB_ENV"
          elif [ -f plugin/CMakeLists.txt ] && [ -f native/CMakeLists.txt ]; then
            echo "SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "::error::Missing sources. Upload Freedom_2_UI_v8.8.zip to repository root, or commit plugin/ and native/."
            exit 1
          fi
      - name: Inspect native parameter mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["SOURCE_ROOT"])
          for name in ("plugin/Source/PluginProcessor.h","plugin/Source/PluginProcessor.cpp"):
              p=root/name
              if not p.exists(): continue
              print("=== SOURCE AUDIT",name,"===")
              lines=p.read_text(errors="replace").splitlines()
              for i,line in enumerate(lines,1):
                  if re.search(r'AudioProcessorValueTreeState|AudioParameter|addParameter|createParameterLayout|ParameterID|processBlock|class Freedom|struct Freedom',line):
                      print(f"{i}: {line[:230]}")
          print("=== NATIVE OSCILLATOR PARAMETER FACTORY ===")
          native=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace").splitlines()
          for n in range(14,min(25,len(native)+1)):
              print(f"{n}: {native[n-1][:400]}")
          print("=== ORIGINAL UI PARAMETER CHANGE CONTRACT ===")
          html_lines=(root/"index.html").read_text(errors="replace").splitlines()
          for n in range(958,min(980,len(html_lines)+1)):
              print(f"{n}: {html_lines[n-1][:700]}")
          print("=== MIDI / DSP PATH ===")
          proc=root/"plugin/Source/PluginProcessor.cpp"
          if proc.exists():
              for i,line in enumerate(proc.read_text(errors="replace").splitlines(),1):
                  if 55 <= i <= 145: print(f"{i}: {line[:240]}")
          cmake=root/"plugin/CMakeLists.txt"
          if cmake.exists():
              print("=== PLUGIN CMAKE ===")
              for i,line in enumerate(cmake.read_text(errors="replace").splitlines(),1):
                  if any(k in line for k in ("IS_SYNTH","NEEDS_MIDI_INPUT","JUCE_WEB_BROWSER","juce_add_plugin","PRODUCT_NAME")):
                      print(f"{i}: {line[:240]}")
          page=root/"index.html"
          if page.exists():
              html=page.read_text(errors="replace")
              ids=re.findall(r'id="([^"]+)"',html,re.I)
              print("=== HTML CONTROL IDS (first 250) ===")
              print(" ".join(ids[:250]))
              print("=== HTML OSCILLATOR / NATIVE BRIDGE CLUES ===")
              for i,line in enumerate(html.splitlines(),1):
                  if re.search(r'osc[123]|oscillator|webmidi|requestMIDIAccess|setParameter|juce\\.',line,re.I):
                      print(f"{i}: {line[:260]}")
                      if i > 8000: break
          PY
      - name: Install native filter ADSR
        shell: bash
        run: python3 scripts/add_filter_adsr.py "$SOURCE_ROOT"
      - name: Embed original Freedom 2 UI
        shell: bash
        run: python3 scripts/prepare_original_ui.py "$SOURCE_ROOT"
      - name: Verify source tree
        shell: bash
        run: |
          test -f "$SOURCE_ROOT/plugin/CMakeLists.txt"
          test -f "$SOURCE_ROOT/native/CMakeLists.txt"
          test -f "$SOURCE_ROOT/plugin/Source/PluginProcessor.cpp"
      - name: Validate original HTML audio engine
        shell: bash
        run: |
          set -euo pipefail
          node "$SOURCE_ROOT/tests/audio_validation.cjs"
          python3 - <<'PY'
          from pathlib import Path
          import os
          page=Path(os.environ["SOURCE_ROOT"])/"plugin/WebUI/index.html"
          data=page.read_bytes()
          assert data.lstrip().lower().startswith(b"<!doctype html"), "Embedded UI must be decoded HTML, not percent-encoded text"
          assert b"freedom-v70-worklet-source" in data, "Original audio worklet must be retained"
          assert b"WEB MIDI NON DISPONIBLE" in data, "Original UI unexpectedly modified"
          print("Original HTML and audio worklet retained; no UI changes")
          PY
      - name: Validate generated native bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_original_ui.py
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["SOURCE_ROOT"])
          page=(root/"plugin/WebUI/index.html").read_text()
          editor=(root/"plugin/Source/PluginEditor.cpp").read_text()
          header=(root/"plugin/Source/PluginProcessor.h").read_text()
          assert page.count('id="liberty-native-oscillators-bridge"') == 1
          match=re.search(r'<script id="liberty-native-oscillators-bridge">(.*?)</script>',page,re.S)
          assert match, "Missing native oscillator bridge script"
          Path("/tmp/freedom-native-bridge-check.js").write_text(match.group(1))
          assert 'freedomGetOscillators' in editor and 'freedomSetOscillator' in editor
          assert '.withNativeIntegrationEnabled()' in editor
          assert 'getValueTreeState()' in header
          assert 'setSize(1400, 920)' in editor
          print("Generated oscillator bridge and native bindings validated")
          PY
          node --check /tmp/freedom-native-bridge-check.js
      - name: Exercise oscillator bridge behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('node:assert/strict');
          const code = fs.readFileSync('/tmp/freedom-native-bridge-check.js','utf8');
          const fields = ['On','Wave','Volume','Octave','Semitone','Fine'];
          const state = {}, host = [];
          for (let osc=1; osc<=3; osc++) for (const field of fields) {
            state['Osc_'+osc+'_'+field] = 0;
            host.push(0);
          }
          const writes = [];
          let tick;
          const api = {
            freedomGetOscillators: async () => [...host],
            freedomSetOscillator: async (osc,field,value) => {
              const index=(osc-1)*6+fields.indexOf(field);
              writes.push([osc,field,value]);
              host[index]=value;
              return true;
            }
          };
          const window = {
            __JUCE__: {backend: {getNativeFunction: name => api[name]}},
            LibertyFreedomUI: {
              getParameters: () => ({...state}),
              setParameter: (key,value) => {state[key]=value;}
            }
          };
          vm.runInNewContext(code,{window,setInterval: callback => {if (!tick) tick=callback;}});
          assert.equal(typeof tick,'function');
          const sleep = () => new Promise(resolve=>setImmediate(resolve));
          (async () => {
            host[2]=0.4;
            tick(); await sleep();
            assert.equal(state.Osc_1_Volume,0.4,'host initial state must reach UI');
            assert.equal(writes.length,0,'initialization must not overwrite host');
            state.Osc_2_Volume=0.7;
            tick(); await sleep();
            assert.equal(host[8],0.7,'UI edit must reach native engine');
            host[8]=0.2;
            tick(); await sleep();
            assert.equal(state.Osc_2_Volume,0.2,'host automation must reach UI');
            // Simultaneous edits: DAW automation must take precedence.
            state.Osc_3_Volume=0.8;
            host[14]=0.35;
            tick(); await sleep();
            assert.equal(state.Osc_3_Volume,0.35,'host must win simultaneous edit');
            assert.equal(host[14],0.35,'simultaneous UI edit must not overwrite host');
            // A subsequent isolated UI edit must still work.
            state.Osc_3_Volume=0.6;
            tick(); await sleep();
            assert.equal(host[14],0.6,'UI must regain control after automation');
            // Reopening the editor must restore values from the existing processor.
            const reopened = {...state};
            reopened.Osc_1_Volume=0;
            reopened.Osc_2_Volume=0;
            reopened.Osc_3_Volume=0;
            const freshWindow = {
              __JUCE__: window.__JUCE__,
              LibertyFreedomUI: {
                getParameters: () => ({...reopened}),
                setParameter: (key,value) => {reopened[key]=value;}
              }
            };
            let reopenTick;
            vm.runInNewContext(code,{
              window:freshWindow,
              setInterval: callback => {if (!reopenTick) reopenTick=callback;}
            });
            reopenTick(); await sleep();
            assert.equal(reopened.Osc_1_Volume,host[2],'reopen must restore OSC1');
            assert.equal(reopened.Osc_2_Volume,host[8],'reopen must restore OSC2');
            assert.equal(reopened.Osc_3_Volume,host[14],'reopen must restore OSC3');
            console.log('Oscillator bridge mock: initialization, UI edits, automation, conflict, editor reopen passed');
          })().catch(error => {console.error(error);process.exitCode=1;});
          JS
      - name: Exercise filter bridge behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs'), vm=require('node:vm');
          const assert=require('node:assert/strict');
          const code=fs.readFileSync('/tmp/freedom-native-bridge-check.js','utf8');
          const state={Filter_Cutoff:500,Filter_Resonance:0,Filter_Type:0};
          const host=[12000,0.2,1], writes=[];
          const api={
            freedomGetFilter:async()=>[...host],
            freedomSetFilter:async(id,value)=>{
              const i=['cutoff','resonance','filterMode'].indexOf(id);
              if(i<0)return false;
              writes.push([id,value]);host[i]=value;return true;
            }
          };
          const timers=[];
          const window={
            __JUCE__:{backend:{getNativeFunction:name=>api[name]}},
            LibertyFreedomUI:{
              getParameters:()=>({...state}),
              setParameter:(key,value)=>{state[key]=value;}
            }
          };
          vm.runInNewContext(code,{window,setInterval:callback=>timers.push(callback)});
          assert.equal(timers.length,3,'oscillator, filter and filter envelope timers expected');
          const tick=timers[1],flush=()=>new Promise(r=>setImmediate(r));
          (async()=>{
            tick();await flush();
            assert.equal(state.Filter_Cutoff,12000,'initial cutoff from processor');
            assert.equal(state.Filter_Resonance,0.2,'initial resonance from processor');
            assert.equal(state.Filter_Type,1,'initial filter mode from processor');
            assert.equal(writes.length,0,'initialization must not overwrite host');
            state.Filter_Cutoff=4500;
            tick();await flush();
            assert.equal(host[0],4500,'cutoff UI change reaches processor');
            host[1]=0.65;
            tick();await flush();
            assert.equal(state.Filter_Resonance,0.65,'host resonance automation reaches UI');
            state.Filter_Cutoff=9000;
            host[0]=7000;
            tick();await flush();
            assert.equal(state.Filter_Cutoff,7000,'host wins simultaneous cutoff edits');
            assert.equal(host[0],7000,'UI must not overwrite host automation');
            state.Filter_Cutoff=8000;
            tick();await flush();
            assert.equal(host[0],8000,'manual cutoff control resumes');
            state.Filter_Type=5;
            tick();await flush();
            assert.equal(host[2],5,'UI mode selection reaches processor');
            host[2]=3;
            tick();await flush();
            assert.equal(state.Filter_Type,3,'DAW filter mode automation reaches UI');
            const fresh={Filter_Cutoff:100,Filter_Resonance:0,Filter_Type:0};
            const callbacks=[];
            vm.runInNewContext(code,{
              window:{
                __JUCE__:window.__JUCE__,
                LibertyFreedomUI:{
                  getParameters:()=>({...fresh}),
                  setParameter:(key,value)=>{fresh[key]=value;}
                }
              },
              setInterval:callback=>callbacks.push(callback)
            });
            callbacks[1]();await flush();
            assert.equal(fresh.Filter_Cutoff,host[0],'reopen restores cutoff');
            assert.equal(fresh.Filter_Resonance,host[1],'reopen restores resonance');
            assert.equal(fresh.Filter_Type,host[2],'reopen restores filter mode');
            console.log('Filter bridge mock: initialization, UI edits, automation, conflict, reopen passed');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Exercise filter ADSR bridge behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const assert=require('node:assert/strict');
          const code=fs.readFileSync('/tmp/freedom-native-bridge-check.js','utf8');
          const keys=['Filter_Envelope_Attack','Filter_Envelope_Decay',
                      'Filter_Envelope_Sustain','Filter_Envelope_Release',
                      'Filter_Envelope_Amount'];
          const ids=['filterEnvAttack','filterEnvDecay','filterEnvSustain',
                     'filterEnvRelease','filterEnvAmount'];
          const host=[0.01,0.25,0.25,0.3,0],writes=[];
          const api={
            freedomGetFilterEnvelope:async()=>[...host],
            freedomSetFilterEnvelope:async(id,value)=>{
              const i=ids.indexOf(id);
              if(i<0)return false;
              writes.push([id,value]);host[i]=value;return true;
            }
          };
          const makeUI=(initial)=>{
            const state=Object.fromEntries(keys.map((k,i)=>[k,initial[i]]));
            const timers=[];
            vm.runInNewContext(code,{
              window:{
                __JUCE__:{backend:{getNativeFunction:name=>api[name]}},
                LibertyFreedomUI:{
                  getParameters:()=>({...state}),
                  setParameter:(key,value)=>{state[key]=value;}
                }
              },
              setInterval:callback=>timers.push(callback)
            });
            assert.equal(timers.length,3,'three native synchronization timers');
            return {state,tick:timers[2]};
          };
          const flush=()=>new Promise(r=>setImmediate(r));
          (async()=>{
            const ui=makeUI([0.5,1,0.9,2,1]);
            ui.tick();await flush();
            for(let i=0;i<keys.length;i++)
              assert.equal(ui.state[keys[i]],host[i],'initial native ADSR value '+keys[i]);
            assert.equal(writes.length,0,'initialization must not overwrite host');
            ui.state.Filter_Envelope_Attack=0.6;
            ui.tick();await flush();
            assert.equal(host[0],0.6,'UI attack edit reaches native processor');
            ui.state.Filter_Envelope_Amount=-1.5;
            ui.tick();await flush();
            assert.equal(host[4],-1.5,'bipolar amount edit reaches native processor');
            host[2]=0.75;
            ui.tick();await flush();
            assert.equal(ui.state.Filter_Envelope_Sustain,0.75,'host sustain automation reaches UI');
            ui.state.Filter_Envelope_Decay=0.8;
            host[1]=0.4;
            ui.tick();await flush();
            assert.equal(ui.state.Filter_Envelope_Decay,0.4,'host automation wins conflict');
            assert.equal(host[1],0.4,'UI does not overwrite automation');
            ui.state.Filter_Envelope_Release=1.2;
            ui.tick();await flush();
            assert.equal(host[3],1.2,'release edit reaches processor');
            // Factory preset load changes all five UI fields in one transaction.
            const preset=[0.12,1.6,0.42,2.4,3.5];
            for(let i=0;i<keys.length;i++)ui.state[keys[i]]=preset[i];
            const writesBeforePreset=writes.length;
            ui.tick();await flush();
            for(let i=0;i<keys.length;i++)
              assert.equal(host[i],preset[i],'preset update reaches native '+keys[i]);
            assert.equal(writes.length-writesBeforePreset,5,
              'preset load must send all five ADSR values exactly once');
            ui.tick();await flush();
            assert.equal(writes.length-writesBeforePreset,5,
              'unchanged preset must not trigger redundant native writes');
            const reopened=makeUI([9,9,9,9,9]);
            reopened.tick();await flush();
            for(let i=0;i<keys.length;i++)
              assert.equal(reopened.state[keys[i]],host[i],'reopen restores '+keys[i]);
            console.log('Filter ADSR bridge mock: initialization, five fields, negative amount, automation, conflict and reopen passed');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Audit filter parameter contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          html=(root/"index.html").read_text(errors="replace")
          processor=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace")
          # Report exact UI keys and native parameter declarations before
          # implementing any mapping; do not guess or modify the audio engine.
          ui_keys=sorted(set(re.findall(r'["\\\'](Filter_[A-Za-z0-9_]+)["\\\']',html)))
          native_lines=[(n,line.strip()) for n,line in enumerate(processor.splitlines(),1)
                        if re.search(r'filter|cutoff|resonan',line,re.I)]
          print("=== ORIGINAL FILTER UI KEYS ===")
          for key in ui_keys: print(key)
          print("=== NATIVE FILTER REFERENCES ===")
          for n,line in native_lines: print(f"{n}: {line[:300]}")
          print(f"Filter audit: {len(ui_keys)} UI keys, {len(native_lines)} native references")
          PY
      - name: Audit filter envelope DSP contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          html=(root/"index.html").read_text(errors="replace")
          processor=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace")
          dsp_files=list((root/"native").rglob("*.h"))+list((root/"native").rglob("*.cpp"))
          ui_fields=("Attack","Decay","Sustain","Release","Amount")
          print("=== ORIGINAL FILTER ENVELOPE DEFAULTS ===")
          for field in ui_fields:
              key="Filter_Envelope_"+field
              matches=re.findall(re.escape('"'+key+'"')+r'\s*:\s*(-?[0-9.]+)',html)
              if field=="Amount":
                  matches+=re.findall(r'"Filter_Envelope_Amount"\s*:\s*(-?[0-9.]+)',html)
              assert matches,f"Original UI field missing: {key}"
              values=[float(v) for v in matches]
              print(key,"count=",len(values),"min=",min(values),"max=",max(values))
          print("=== NATIVE FILTER ENVELOPE REFERENCES ===")
          refs=0
          for file in [root/"plugin/Source/PluginProcessor.cpp",*dsp_files]:
              if not file.exists():continue
              for n,line in enumerate(file.read_text(errors="replace").splitlines(),1):
                  if re.search(r'filter.*(envelope|attack|decay|sustain|release)|(?:envelope|attack|decay|sustain|release).*filter',line,re.I):
                      print(f"{file.relative_to(root)}:{n}: {line.strip()[:250]}")
                      refs+=1
          print("Native filter envelope references:",refs)
          print("Audit only: no new DSP parameters or behavior")
          PY
      - name: Verify filter envelope implementation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          processor=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace")
          dsp_h=(root/"native/include/FreedomDSP.h")
          dsp_cpp=(root/"native/src/FreedomDSP.cpp")
          assert dsp_cpp.exists(),"Native DSP implementation missing"
          dsp=dsp_cpp.read_text(errors="replace")
          print("=== FILTER ENVELOPE IMPLEMENTATION READINESS ===")
          for key in ("filterEnvAttack","filterEnvDecay","filterEnvSustain",
                      "filterEnvRelease","filterEnvAmount"):
              found=bool(re.search(r'\b'+re.escape(key)+r'\b',processor+"\n"+dsp))
              print(key, "present" if found else "not implemented")
          print("Native DSP file:",dsp_cpp.relative_to(root))
          print("Native header candidate:",dsp_h.relative_to(root),"exists:",dsp_h.exists())
          print("NOTE: UI filter ADSR controls are not yet proven to modulate audio")
          PY
      - name: Inspect DSP voice and filter insertion points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["SOURCE_ROOT"])
          for relative in ("native/include/FreedomDSP.h","native/src/FreedomDSP.cpp",
                           "plugin/Source/PluginProcessor.cpp"):
              file=root/relative
              lines=file.read_text(errors="replace").splitlines()
              print("=== "+relative+" ===")
              for i,line in enumerate(lines):
                  if any(token in line for token in ("struct Voice","struct Params","struct Parameters",
                      "noteOn(","noteOff(","processBlock(","processSample(","cutoffHz",
                      "filterMode","filterState","filterEnv","envelope")):
                      lo=max(0,i-2);hi=min(len(lines),i+3)
                      for j in range(lo,hi):
                          print(f"{j+1}: {lines[j][:280]}")
                      print("---")
          PY
      - name: Capture DSP source for filter envelope implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["SOURCE_ROOT"])
          for name in ("native/include/FreedomDSP.h","native/src/FreedomDSP.cpp",
                       "plugin/Source/PluginProcessor.cpp"):
              file=root/name
              print("=== BEGIN "+name+" ===")
              for n,line in enumerate(file.read_text(errors="replace").splitlines(),1):
                  print(f"{n:03d} {line}")
              print("=== END "+name+" ===")
          PY
      - name: Verify original filter mode mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          html=(root/"index.html").read_text(errors="replace")
          native=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace")
          print("=== FILTER TYPE ORIGINAL UI CONTEXT ===")
          matches=list(re.finditer(r'Filter_Type',html))
          assert matches,"Filter_Type missing from original UI"
          for m in matches[:12]:
              print(repr(html[max(0,m.start()-180):m.end()+240]))
          print("=== NATIVE FILTER MODE DECLARATION ===")
          lines=[line.strip() for line in native.splitlines() if 'filterMode' in line]
          assert any('LP24' in line and 'LP12' in line and 'HP24' in line
                     and 'HP12' in line and 'BP12' in line and 'NOTCH' in line
                     for line in lines),"Six native filter modes not found"
          for line in lines: print(line[:700])
          # The original preset bank stores Filter_Type as an integer index.
          # Ensure all observed preset indices fit the six native choices.
          indices=[int(v) for v in re.findall(r'"Filter_Type"\s*:\s*([0-9]+)',html)]
          assert indices,"No numeric Filter_Type values found in original preset bank"
          assert all(0<=v<6 for v in indices),f"Unsupported Filter_Type index: {set(indices)}"
          print("Original preset Filter_Type indices:",sorted(set(indices)))
          print("Filter mode contract inspection completed")
          PY
      - name: Exercise native filter ADSR audio response
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/filter_adsr_audio_test.cpp" <<'CPP'
          #include "FreedomDSP.h"
          #include <algorithm>
          #include <cassert>
          #include <cmath>
          #include <iostream>
          #include <vector>
          using liberty::FreedomDSP;
          static std::vector<float> render(float amount, bool noteOff=false) {
            FreedomDSP dsp(48000.0);
            FreedomDSP::Parameters p{};
            p.cutoffHz=450.0f;
            p.resonance=0.15f;
            p.filterMode=FreedomDSP::FilterMode::LP24;
            p.filterEnvAttack=0.008f;
            p.filterEnvDecay=0.12f;
            p.filterEnvSustain=0.2f;
            p.filterEnvRelease=0.15f;
            p.filterEnvAmount=amount;
            p.releaseSeconds=0.4f;
            dsp.setParameters(p);
            dsp.noteOn(0,60,110);
            std::vector<float> left(8192),right(8192);
            dsp.process(left.data(),right.data(),4096);
            if(noteOff)dsp.noteOff(0,60);
            dsp.process(left.data()+4096,right.data()+4096,4096);
            for(float sample:left)assert(std::isfinite(sample));
            for(float sample:right)assert(std::isfinite(sample));
            return left;
          }
          int main() {
            auto zero=render(0.0f);
            auto boosted=render(3.0f);
            auto inverted=render(-3.0f);
            auto released=render(3.0f,true);
            double positiveDifference=0,negativeDifference=0,releaseDifference=0;
            double zeroEnergy=0;
            for(std::size_t i=0;i<zero.size();++i) {
              zeroEnergy+=std::abs(zero[i]);
              positiveDifference+=std::abs(zero[i]-boosted[i]);
              negativeDifference+=std::abs(zero[i]-inverted[i]);
              if(i>=4096)releaseDifference+=std::abs(boosted[i]-released[i]);
            }
            std::cout<<"Filter ADSR audio: baseline energy="<<zeroEnergy
                     <<", positive amount difference="<<positiveDifference
                     <<", negative amount difference="<<negativeDifference
                     <<", note-off difference="<<releaseDifference<<"\n";
            assert(zeroEnergy>0.01);
            assert(positiveDifference>0.01);
            assert(negativeDifference>0.01);
            assert(releaseDifference>0.01);
            // Restored ADSR values must affect rendered sound, not just XML state.
            auto renderRestored=[](float amount){
              FreedomDSP dsp(48000.0);
              FreedomDSP::Parameters p{};
              p.cutoffHz=450.0f;
              p.resonance=0.15f;
              p.filterMode=FreedomDSP::FilterMode::LP24;
              p.filterEnvAttack=0.008f;
              p.filterEnvDecay=0.12f;
              p.filterEnvSustain=0.2f;
              p.filterEnvRelease=0.15f;
              p.filterEnvAmount=amount;
              dsp.setParameters(p);
              dsp.noteOn(0,60,110);
              std::vector<float> left(4096),right(4096);
              dsp.process(left.data(),right.data(),static_cast<int>(left.size()));
              for(float sample:left)assert(std::isfinite(sample));
              return left;
            };
            const auto restoredA=renderRestored(-1.75f);
            const auto restoredB=renderRestored(4.25f);
            const auto restoredAAgain=renderRestored(-1.75f);
            double restoredDifference=0,restoreRepeatDifference=0;
            for(std::size_t i=0;i<restoredA.size();i++){
              restoredDifference+=std::abs(restoredA[i]-restoredB[i]);
              restoreRepeatDifference+=std::abs(restoredA[i]-restoredAAgain[i]);
            }
            assert(restoredDifference>0.01);
            assert(restoreRepeatDifference<0.0001);
            std::cout<<"Restored filter ADSR settings produce distinct, repeatable native audio\\n";
            // Host sample-rate changes must remain finite with extreme envelope settings.
            for(double sampleRate:{44100.0,48000.0,96000.0}){
              for(float amount:{-4.5f,0.0f,4.5f}){
                FreedomDSP rateDsp(sampleRate);
                FreedomDSP::Parameters rateParams{};
                rateParams.cutoffHz=800.0f;
                rateParams.resonance=0.6f;
                rateParams.filterMode=FreedomDSP::FilterMode::LP24;
                rateParams.filterEnvAttack=0.001f;
                rateParams.filterEnvDecay=0.001f;
                rateParams.filterEnvSustain=1.0f;
                rateParams.filterEnvRelease=0.001f;
                rateParams.filterEnvAmount=amount;
                rateDsp.setParameters(rateParams);
                rateDsp.noteOn(0,72,127);
                std::vector<float> rateL(2048),rateR(2048);
                rateDsp.process(rateL.data(),rateR.data(),1024);
                rateDsp.noteOff(0,72);
                rateDsp.process(rateL.data()+1024,rateR.data()+1024,1024);
                double energy=0;
                for(float sample:rateL){assert(std::isfinite(sample));energy+=std::abs(sample);}
                for(float sample:rateR)assert(std::isfinite(sample));
                assert(energy>0.0001);
              }
            }
            std::cout<<"Filter ADSR finite at 44.1/48/96 kHz and bipolar modulation extremes\\n";
            // Rapid preset changes during playback must never produce NaNs or infinities.
            FreedomDSP switching(48000.0);
            FreedomDSP::Parameters switchParams{};
            switchParams.cutoffHz=600.0f;
            switchParams.resonance=0.3f;
            switchParams.filterMode=FreedomDSP::FilterMode::LP24;
            switchParams.filterEnvAttack=0.005f;
            switchParams.filterEnvDecay=0.15f;
            switchParams.filterEnvSustain=0.4f;
            switchParams.filterEnvRelease=0.12f;
            switching.setParameters(switchParams);
            switching.noteOn(0,60,100);
            std::vector<float> switchL(256),switchR(256);
            double switchEnergy=0;
            for(int block=0;block<120;block++){
              switchParams.filterEnvAmount=(block%2==0)?4.5f:-4.5f;
              switchParams.filterEnvAttack=(block%3==0)?0.001f:2.0f;
              switchParams.filterEnvRelease=(block%3==1)?0.001f:3.0f;
              switchParams.cutoffHz=(block%2==0)?250.0f:6500.0f;
              switching.setParameters(switchParams);
              if(block==60)switching.noteOff(0,60);
              switching.process(switchL.data(),switchR.data(),256);
              for(float sample:switchL){assert(std::isfinite(sample));switchEnergy+=std::abs(sample);}
              for(float sample:switchR)assert(std::isfinite(sample));
            }
            assert(switchEnergy>0.01);
            std::cout<<"Rapid filter ADSR preset switching: 120 finite audio blocks\\n";
            // A chord must survive preset switching and staggered MIDI note-offs.
            FreedomDSP chordSwitch(48000.0);
            FreedomDSP::Parameters chordParams{};
            chordParams.cutoffHz=900.0f;
            chordParams.filterMode=FreedomDSP::FilterMode::LP24;
            chordParams.filterEnvAttack=0.01f;
            chordParams.filterEnvDecay=0.1f;
            chordParams.filterEnvSustain=0.5f;
            chordParams.filterEnvRelease=0.15f;
            chordParams.filterEnvAmount=2.0f;
            chordSwitch.setParameters(chordParams);
            chordSwitch.noteOn(0,48,110);
            chordSwitch.noteOn(0,55,105);
            chordSwitch.noteOn(0,60,100);
            std::vector<float> chordL(256),chordR(256);
            double switchingChordEnergy=0;
            for(int block=0;block<96;block++){
              if(block==24)chordSwitch.noteOff(0,48);
              if(block==48)chordSwitch.noteOff(0,55);
              if(block==72)chordSwitch.noteOff(0,60);
              chordParams.filterEnvAmount=(block%2==0)?-2.5f:3.5f;
              chordParams.filterEnvSustain=(block%3==0)?0.0f:0.8f;
              chordSwitch.setParameters(chordParams);
              chordSwitch.process(chordL.data(),chordR.data(),256);
              for(float sample:chordL){assert(std::isfinite(sample));switchingChordEnergy+=std::abs(sample);}
              for(float sample:chordR)assert(std::isfinite(sample));
            }
            assert(switchingChordEnergy>0.01);
            std::cout<<"MIDI chord with staggered note-offs and live ADSR changes: 96 finite blocks\\n";
            // Sustain pedal must postpone filter envelope release until pedal-up.
            auto pedalRender=[](bool holdPedal){
              FreedomDSP dsp(48000.0);
              FreedomDSP::Parameters p{};
              p.cutoffHz=500.0f;
              p.filterMode=FreedomDSP::FilterMode::LP24;
              p.filterEnvAttack=0.005f;
              p.filterEnvDecay=0.1f;
              p.filterEnvSustain=0.8f;
              p.filterEnvRelease=0.08f;
              p.filterEnvAmount=3.0f;
              p.releaseSeconds=0.35f;
              dsp.setParameters(p);
              dsp.noteOn(0,60,110);
              std::vector<float> left(16384),right(16384);
              dsp.process(left.data(),right.data(),4096);
              if(holdPedal)dsp.sustain(0,true);
              dsp.noteOff(0,60);
              dsp.process(left.data()+4096,right.data()+4096,4096);
              if(holdPedal)dsp.sustain(0,false);
              dsp.process(left.data()+8192,right.data()+8192,8192);
              for(float sample:left)assert(std::isfinite(sample));
              return left;
            };
            const auto held=pedalRender(true);
            const auto immediate=pedalRender(false);
            double pedalDifference=0;
            for(std::size_t i=4096;i<8192;i++)
              pedalDifference+=std::abs(held[i]-immediate[i]);
            std::cout<<"Sustain pedal held-vs-released audio difference="
                     <<pedalDifference<<"\n";
            assert(pedalDifference>0.01);
            // Polyphony: chords, overlapping keys, staggered releases and voice stealing.
            FreedomDSP poly(48000.0);
            FreedomDSP::Parameters polyParams{};
            polyParams.filterEnvAttack=0.003f;
            polyParams.filterEnvDecay=0.07f;
            polyParams.filterEnvSustain=0.4f;
            polyParams.filterEnvRelease=0.12f;
            polyParams.filterEnvAmount=2.5f;
            polyParams.cutoffHz=650.0f;
            polyParams.releaseSeconds=0.18f;
            poly.setParameters(polyParams);
            std::vector<float> polyL(512),polyR(512);
            auto renderPoly=[&](){
              poly.process(polyL.data(),polyR.data(),polyL.size());
              double energy=0;
              for(std::size_t i=0;i<polyL.size();i++){
                assert(std::isfinite(polyL[i]) && std::isfinite(polyR[i]));
                energy+=std::abs(polyL[i]);
              }
              return energy;
            };
            for(int note:{48,52,55,60})poly.noteOn(0,note,100);
            const double chordEnergy=renderPoly();
            assert(chordEnergy>0.001);
            poly.noteOn(0,60,115); // repeated key overlaps its existing voice
            assert(renderPoly()>0.001);
            poly.noteOff(0,60); // release only the newest matching note
            assert(renderPoly()>0.001);
            for(int note:{48,52,55,60})poly.noteOff(0,note);
            renderPoly();
            // Exceed the 16-voice limit to exercise voice stealing under ADSR.
            for(int note=36;note<64;note++){
              poly.noteOn(0,note,90);
              renderPoly();
            }
            assert(poly.activeVoices()<=FreedomDSP::MaxVoices);
            for(int note=36;note<64;note++)poly.noteOff(0,note);
            for(int i=0;i<100;i++)renderPoly();
            std::cout<<"Polyphonic filter ADSR: chord energy="<<chordEnergy
                     <<", active voices after release="<<poly.activeVoices()<<"\n";
            // Stress filter ADSR boundaries while notes play; audio must stay finite.
            FreedomDSP stress(48000.0);
            FreedomDSP::Parameters stressParams{};
            stressParams.cutoffHz=1200.0f;
            stressParams.filterEnvAttack=0.001f;
            stressParams.filterEnvDecay=0.001f;
            stressParams.filterEnvSustain=0.0f;
            stressParams.filterEnvRelease=0.001f;
            stressParams.filterEnvAmount=-4.5f;
            stress.setParameters(stressParams);
            stress.noteOn(0,64,110);
            std::vector<float> stressL(256),stressR(256);
            double stressPeak=0;
            for(int block=0;block<240;block++){
              stressParams.filterEnvAttack=(block%2)?12.0f:0.001f;
              stressParams.filterEnvDecay=(block%3)?0.001f:12.0f;
              stressParams.filterEnvSustain=(block%2)?1.0f:0.0f;
              stressParams.filterEnvRelease=(block%2)?0.001f:12.0f;
              stressParams.filterEnvAmount=(block%2)?4.5f:-4.5f;
              stressParams.cutoffHz=(block%2)?18000.0f:35.0f;
              stress.setParameters(stressParams);
              if(block%24==0)stress.noteOn(0,64+(block/24)%12,100);
              if(block%24==12)stress.noteOff(0,64+(block/24)%12);
              stress.process(stressL.data(),stressR.data(),stressL.size());
              for(std::size_t i=0;i<stressL.size();i++){
                assert(std::isfinite(stressL[i]) && std::isfinite(stressR[i]));
                stressPeak=std::max(stressPeak,static_cast<double>(std::abs(stressL[i])));
                stressPeak=std::max(stressPeak,static_cast<double>(std::abs(stressR[i])));
              }
            }
            assert(stressPeak>0.001);
            std::cout<<"Filter ADSR parameter stress: 240 blocks, peak="<<stressPeak<<"\n";
            std::cout<<"Native filter ADSR audio tests passed\n";
          }
          CPP
          clang++ -std=c++17 -O2 -I "$SOURCE_ROOT/native/include" \
            "$SOURCE_ROOT/native/src/FreedomDSP.cpp" \
            "$RUNNER_TEMP/filter_adsr_audio_test.cpp" \
            -o "$RUNNER_TEMP/filter_adsr_audio_test"
          "$RUNNER_TEMP/filter_adsr_audio_test"
      - name: Verify AU VST3 filter ADSR state persistence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          processor=(root/"plugin/Source/PluginProcessor.cpp").read_text()
          editor=(root/"plugin/Source/PluginEditor.cpp").read_text()
          html=(root/"plugin/WebUI/index.html").read_text()
          fields=("Attack","Decay","Sustain","Release","Amount")
          for field in fields:
              native="filterEnv"+field
              ui="Filter_Envelope_"+field
              assert re.search(r'f\("'+native+r'"\s*,',processor),f"APVTS parameter missing: {native}"
              assert re.search(r'val\("'+native+r'"\)',processor),f"DSP mapping missing: {native}"
              assert native in editor,f"Native editor binding missing: {native}"
              assert ui in html,f"Original UI binding missing: {ui}"
          assert re.search(r'getStateInformation\s*\([^)]*\)\s*\{[^}]*apvts\.copyState\(\)',processor,re.S), \
              "Host state save must serialize APVTS"
          assert re.search(r'setStateInformation\s*\([^)]*\)\s*\{[^}]*apvts\.replaceState\(',processor,re.S), \
              "Host state load must restore APVTS"
          print("AU/VST3 state contract: 5 filter ADSR parameters registered, DSP/UI mapped, APVTS host save/restore present")
          print("Static contract check only; actual DAW preset roundtrip remains to be tested")
          PY
      - name: Verify filter ADSR preset bank compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["SOURCE_ROOT"])
          html=(root/"index.html").read_text(errors="replace")
          processor=(root/"plugin/Source/PluginProcessor.cpp").read_text(errors="replace")
          limits={
              "Attack":(.001,12.0),
              "Decay":(.001,12.0),
              "Sustain":(0.0,1.0),
              "Release":(.001,12.0),
              "Amount":(-4.5,4.5),
          }
          total=0
          for field,(minimum,maximum) in limits.items():
              key="Filter_Envelope_"+field
              values=[float(v) for v in re.findall(
                  r'["\x27]'+re.escape(key)+r'["\x27]\s*:\s*(-?\d+(?:\.\d+)?)',html)]
              assert values,f"No factory preset values found for {key}"
              invalid=[v for v in values if not minimum<=v<=maximum]
              assert not invalid,f"{key}: values outside native parameter range: {invalid[:10]}"
              assert 'filterEnv'+field in processor,f"Native parameter missing: {field}"
              total+=len(values)
              print(f"{key}: {len(values)} preset values; observed [{min(values)}, {max(values)}], native [{minimum}, {maximum}]")
          print(f"Filter ADSR factory preset compatibility: {total} values within native ranges")
          PY
