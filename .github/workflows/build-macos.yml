name: Freedom 2 — AU & VST3 (Apple Silicon)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freedom2-macos
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify sources
        shell: bash
        run: |
          test -f plugin/CMakeLists.txt || { echo "::error::Missing plugin/CMakeLists.txt. Upload the Freedom 2 native project first."; exit 1; }
          test -f native/CMakeLists.txt || { echo "::error::Missing native/CMakeLists.txt."; exit 1; }
      - name: Install CMake and JUCE
        shell: bash
        run: |
          brew install cmake
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure ARM64
        shell: bash
        run: |
          cmake -S plugin -B build -G Xcode \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=OFF
      - name: Build AU VST3 and Standalone
        shell: bash
        run: cmake --build build --config Release --parallel 3
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          find build -type d \( -name 'Freedom 2.component' -o -name 'Freedom 2.vst3' -o -name 'Freedom 2.app' \) -prune -print | while IFS= read -r item; do
            cp -R "$item" dist/
          done
          ls -lah dist
          test -d "dist/Freedom 2.component" || { echo "::error::AU not found"; exit 1; }
          test -d "dist/Freedom 2.vst3" || { echo "::error::VST3 not found"; exit 1; }
          for item in dist/*; do codesign --force --deep --sign - "$item"; done
          ditto -c -k --sequesterRsrc --keepParent dist Freedom-2-macOS-ARM64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-2-macOS-ARM64
          path: Freedom-2-macOS-ARM64.zip
          retention-days: 7
