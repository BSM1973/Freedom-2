name: Freedom 2 - macOS AU VST3 Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'Freedom_2_UI_v8.8.zip'
      - 'scripts/prepare_original_ui.py'
permissions:
  contents: read
concurrency:
  group: freedom2-macos
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Freedom_2_UI_v8.8.zip ]; then
            unzip -q Freedom_2_UI_v8.8.zip -d "$RUNNER_TEMP/freedom-src"
            echo "SOURCE_ROOT=$RUNNER_TEMP/freedom-src/freedom2_v88" >> "$GITHUB_ENV"
          elif [ -f plugin/CMakeLists.txt ] && [ -f native/CMakeLists.txt ]; then
            echo "SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "::error::Missing sources. Upload Freedom_2_UI_v8.8.zip to repository root, or commit plugin/ and native/."
            exit 1
          fi
      - name: Inspect native parameter mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["SOURCE_ROOT"])
          for name in ("plugin/Source/PluginProcessor.h","plugin/Source/PluginProcessor.cpp"):
              p=root/name
              if not p.exists(): continue
              print("=== SOURCE AUDIT",name,"===")
              lines=p.read_text(errors="replace").splitlines()
              for i,line in enumerate(lines,1):
                  if re.search(r'AudioProcessorValueTreeState|AudioParameter|addParameter|createParameterLayout|ParameterID|processBlock|class Freedom|struct Freedom',line):
                      print(f"{i}: {line[:230]}")
          page=root/"index.html"
          if page.exists():
              html=page.read_text(errors="replace")
              ids=re.findall(r'<(?:input|select|button)\\b[^>]*?\\bid=["\\']([^"\\']+)',html,re.I)
              print("=== HTML CONTROL IDS ===")
              print(" ".join(ids[:160]))
          PY
      - name: Embed original Freedom 2 UI
        shell: bash
        run: python3 scripts/prepare_original_ui.py "$SOURCE_ROOT"
      - name: Verify source tree
        shell: bash
        run: |
          test -f "$SOURCE_ROOT/plugin/CMakeLists.txt"
          test -f "$SOURCE_ROOT/native/CMakeLists.txt"
          test -f "$SOURCE_ROOT/plugin/Source/PluginProcessor.cpp"
      - name: Fetch JUCE
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          xcodebuild -version
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure ARM64
        shell: bash
        run: |
          cmake -S "$SOURCE_ROOT/plugin" -B "$RUNNER_TEMP/freedom-build" -G Xcode \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_FLAGS="-DJUCE_FORCE_USE_LEGACY_PARAM_IDS=1"
      - name: Build AU VST3 Standalone
        shell: bash
        run: cmake --build "$RUNNER_TEMP/freedom-build" --config Release --parallel 3
      - name: Collect plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$RUNNER_TEMP/freedom-build" -type d \( -name 'Freedom 2.component' -o -name 'Freedom 2.vst3' -o -name 'Freedom 2.app' \) -prune -print | while IFS= read -r item; do
            cp -R "$item" dist/
          done
          ls -lah dist
          test -d "dist/Freedom 2.component"
          test -d "dist/Freedom 2.vst3"
          for item in dist/*; do codesign --force --deep --sign - "$item"; done
          ditto -c -k --sequesterRsrc --keepParent dist Freedom-2-macOS-ARM64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-2-macOS-ARM64
          path: Freedom-2-macOS-ARM64.zip
          retention-days: 7
