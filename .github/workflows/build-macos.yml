      - name: Exercise JUCE ValueTree state serialization roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/juce-state-test"
          export JUCE_DIR="$RUNNER_TEMP/JUCE"
          cat > "$RUNNER_TEMP/juce-state-test/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(FreedomStateRoundtrip VERSION 1.0.0 LANGUAGES CXX)
          add_subdirectory("$ENV{JUCE_DIR}" juce)
          juce_add_console_app(FreedomStateRoundtrip PRODUCT_NAME "Freedom State Roundtrip")
          target_sources(FreedomStateRoundtrip PRIVATE main.cpp)
          target_compile_features(FreedomStateRoundtrip PRIVATE cxx_std_17)
          target_compile_options(FreedomStateRoundtrip PRIVATE -UNDEBUG)
          target_link_libraries(FreedomStateRoundtrip PRIVATE juce::juce_core juce::juce_data_structures juce::juce_audio_processors)
          CMAKE
          cat > "$RUNNER_TEMP/juce-state-test/main.cpp" <<'CPP'
          #include <juce_data_structures/juce_data_structures.h>
          #include <juce_audio_processors/juce_audio_processors.h>
          #include <cassert>
          #include <cmath>
          #include <iostream>
          int main() {
            const char* ids[]={"filterEnvAttack","filterEnvDecay","filterEnvSustain",
                               "filterEnvRelease","filterEnvAmount"};
            const float values[]={0.16f,1.8f,0.45f,2.6f,-1.75f};
            juce::ValueTree saved("PARAMETERS");
            for(int i=0;i<5;i++){
              juce::ValueTree param("PARAM");
              param.setProperty("id",ids[i],nullptr);
              param.setProperty("value",values[i],nullptr);
              saved.addChild(param,-1,nullptr);
            }
            auto xml=saved.createXml();
            assert(xml!=nullptr);
            juce::MemoryOutputStream binary;
            xml->writeTo(binary);
            const auto restoredXml=juce::parseXML(juce::String::fromUTF8(
                static_cast<const char*>(binary.getData()),static_cast<int>(binary.getDataSize())));
            assert(restoredXml!=nullptr);
            auto restored=juce::ValueTree::fromXml(*restoredXml);
            assert(restored.isValid() && restored.getNumChildren()==5);
            for(int i=0;i<5;i++){
              auto p=restored.getChild(i);
              assert(p.getProperty("id").toString()==ids[i]);
              assert(std::abs(static_cast<float>(p.getProperty("value"))-values[i])<0.0001f);
            }
            // Verify a second preset replaces the first state without stale ADSR values.
            const float replacement[]={0.005f,11.0f,0.9f,0.04f,4.25f};
            juce::ValueTree second("PARAMETERS");
            for(int i=0;i<5;i++){
              juce::ValueTree param("PARAM");
              param.setProperty("id",ids[i],nullptr);
              param.setProperty("value",replacement[i],nullptr);
              second.addChild(param,-1,nullptr);
            }
            auto secondXml=second.createXml();
            assert(secondXml!=nullptr);
            juce::MemoryOutputStream secondBinary;
            secondXml->writeTo(secondBinary);
            auto secondParsed=juce::parseXML(juce::String::fromUTF8(
                static_cast<const char*>(secondBinary.getData()),
                static_cast<int>(secondBinary.getDataSize())));
            assert(secondParsed!=nullptr);
            restored=juce::ValueTree::fromXml(*secondParsed);
            assert(restored.getNumChildren()==5);
            for(int i=0;i<5;i++){
              const auto param=restored.getChild(i);
              assert(param.getProperty("id").toString()==ids[i]);
              assert(std::abs(static_cast<float>(param.getProperty("value"))-replacement[i])<0.0001f);
              assert(std::abs(static_cast<float>(param.getProperty("value"))-values[i])>0.0001f);
            }
            // Invalid or truncated state must not be mistaken for a valid preset.
            assert(juce::parseXML("<PARAMETERS><PARAM") == nullptr);
            // Match the exact binary XML envelope used by Freedom2Processor.
            juce::MemoryBlock hostChunk;
            juce::AudioProcessor::copyXmlToBinary(*secondXml,hostChunk);
            assert(hostChunk.getSize()>0);
            auto hostXml=juce::AudioProcessor::getXmlFromBinary(
                hostChunk.getData(),static_cast<int>(hostChunk.getSize()));
            assert(hostXml!=nullptr);
            auto hostTree=juce::ValueTree::fromXml(*hostXml);
            assert(hostTree.getNumChildren()==5);
            for(int i=0;i<5;i++){
              assert(hostTree.getChild(i).getProperty("id").toString()==ids[i]);
              assert(std::abs(static_cast<float>(hostTree.getChild(i).getProperty("value"))
                     -replacement[i])<0.0001f);
            }
            // Persist a third host snapshot and verify earlier chunks stay immutable.
            const float thirdValues[]={0.003f,0.2f,0.0f,8.0f,-4.0f};
            juce::ValueTree third("PARAMETERS");
            for(int i=0;i<5;i++){
              juce::ValueTree param("PARAM");
              param.setProperty("id",ids[i],nullptr);
              param.setProperty("value",thirdValues[i],nullptr);
              third.addChild(param,-1,nullptr);
            }
            auto thirdXml=third.createXml();
            assert(thirdXml!=nullptr);
            juce::MemoryBlock thirdChunk;
            juce::AudioProcessor::copyXmlToBinary(*thirdXml,thirdChunk);
            auto thirdParsed=juce::AudioProcessor::getXmlFromBinary(
                thirdChunk.getData(),static_cast<int>(thirdChunk.getSize()));
            assert(thirdParsed!=nullptr);
            auto thirdTree=juce::ValueTree::fromXml(*thirdParsed);
            for(int i=0;i<5;i++){
              assert(std::abs(static_cast<float>(thirdTree.getChild(i).getProperty("value"))
                     -thirdValues[i])<0.0001f);
            }
            auto originalAgain=juce::AudioProcessor::getXmlFromBinary(
                hostChunk.getData(),static_cast<int>(hostChunk.getSize()));
            assert(originalAgain!=nullptr);
            auto originalTree=juce::ValueTree::fromXml(*originalAgain);
            for(int i=0;i<5;i++){
              assert(std::abs(static_cast<float>(originalTree.getChild(i).getProperty("value"))
                     -replacement[i])<0.0001f);
            }
            // Reject incomplete binary XML headers; trailing padding can be optional.
             for(size_t length=0;length<8 && length<hostChunk.getSize();++length){
               auto truncated=juce::AudioProcessor::getXmlFromBinary(
                   hostChunk.getData(),static_cast<int>(length));
               assert(truncated==nullptr);
             }
             const char badChunk[]="invalid host chunk";
            assert(juce::AudioProcessor::getXmlFromBinary(badChunk,sizeof(badChunk))==nullptr);
            // Reject a valid XML payload wrapped with an invalid JUCE magic number.
            juce::MemoryBlock corruptedMagic(hostChunk);
            auto* magicBytes=static_cast<unsigned char*>(corruptedMagic.getData());
            magicBytes[0]^=0xff;
            assert(juce::AudioProcessor::getXmlFromBinary(
                corruptedMagic.getData(),static_cast<int>(corruptedMagic.getSize()))==nullptr);
            // A malformed length in the binary header must not restore a preset.
            juce::MemoryBlock corruptedLength(hostChunk);
            auto* lengthBytes=static_cast<unsigned char*>(corruptedLength.getData());
            for(int i=4;i<8;i++)lengthBytes[i]=0xff;
            assert(juce::AudioProcessor::getXmlFromBinary(
                corruptedLength.getData(),static_cast<int>(corruptedLength.getSize()))==nullptr);
            // Simulate Freedom2Processor's APVTS root-type validation with a
            // structurally valid host chunk belonging to another plugin.
            juce::ValueTree foreignState("FOREIGN_PLUGIN_PARAMETERS");
            juce::ValueTree foreignParam("PARAM");
            foreignParam.setProperty("id",ids[0],nullptr);
            foreignParam.setProperty("value",0.99f,nullptr);
            foreignState.addChild(foreignParam,-1,nullptr);
            auto foreignXml=foreignState.createXml();
            assert(foreignXml!=nullptr);
            juce::MemoryBlock foreignChunk;
            juce::AudioProcessor::copyXmlToBinary(*foreignXml,foreignChunk);
            auto decodedForeign=juce::AudioProcessor::getXmlFromBinary(
                foreignChunk.getData(),static_cast<int>(foreignChunk.getSize()));
            assert(decodedForeign!=nullptr);
            assert(!decodedForeign->hasTagName(saved.getType()));
            assert(hostTree.getNumChildren()==5);
            for(int i=0;i<5;i++)
              assert(std::abs(static_cast<float>(hostTree.getChild(i).getProperty("value"))
                     -replacement[i])<0.0001f);
            // A matching root with missing ADSR entries must not be mistaken
            // for a complete five-parameter factory state in this test.
            juce::ValueTree incomplete("PARAMETERS");
            for(int i=0;i<4;i++){
              juce::ValueTree param("PARAM");
              param.setProperty("id",ids[i],nullptr);
              param.setProperty("value",replacement[i],nullptr);
              incomplete.addChild(param,-1,nullptr);
            }
            auto incompleteXml=incomplete.createXml();
            assert(incompleteXml!=nullptr);
            juce::MemoryBlock incompleteChunk;
            juce::AudioProcessor::copyXmlToBinary(*incompleteXml,incompleteChunk);
            auto incompleteDecoded=juce::AudioProcessor::getXmlFromBinary(
                incompleteChunk.getData(),static_cast<int>(incompleteChunk.getSize()));
            assert(incompleteDecoded!=nullptr);
            auto incompleteTree=juce::ValueTree::fromXml(*incompleteDecoded);
            assert(incompleteTree.getNumChildren()==4);
            bool hasAmount=false;
            for(int i=0;i<incompleteTree.getNumChildren();i++)
              hasAmount |= incompleteTree.getChild(i).getProperty("id").toString()==ids[4];
            assert(!hasAmount);
            // Model reopening a project: replace a different in-memory state
            // with the complete decoded host snapshot and verify all ADSR values.
            juce::ValueTree reopened("PARAMETERS");
            for(int i=0;i<5;i++){
              juce::ValueTree param("PARAM");
              param.setProperty("id",ids[i],nullptr);
              param.setProperty("value",0.0f,nullptr);
              reopened.addChild(param,-1,nullptr);
            }
            assert(reopened.getNumChildren()==5);
            reopened=juce::ValueTree::fromXml(*hostXml);
            assert(reopened.isValid() && reopened.getNumChildren()==5);
            for(int i=0;i<5;i++){
              assert(reopened.getChild(i).getProperty("id").toString()==ids[i]);
              assert(std::abs(static_cast<float>(reopened.getChild(i).getProperty("value"))
                     -replacement[i])<0.0001f);
            }
            // Exercise JUCE host chunks with multiple realistic ADSR snapshots.
            for(int snapshot=0;snapshot<32;snapshot++){
              juce::ValueTree variation("PARAMETERS");
              for(int i=0;i<5;i++){
                const float value=static_cast<float>((snapshot+1)*(i+2))/100.0f;
                juce::ValueTree param("PARAM");
                param.setProperty("id",ids[i],nullptr);
                param.setProperty("value",value,nullptr);
                variation.addChild(param,-1,nullptr);
              }
              auto variationXml=variation.createXml();
              assert(variationXml!=nullptr);
              juce::MemoryBlock chunk;
              juce::AudioProcessor::copyXmlToBinary(*variationXml,chunk);
              auto parsed=juce::AudioProcessor::getXmlFromBinary(
                  chunk.getData(),static_cast<int>(chunk.getSize()));
              assert(parsed!=nullptr);
              auto tree=juce::ValueTree::fromXml(*parsed);
              assert(tree.getNumChildren()==5);
              for(int i=0;i<5;i++){
                const float expected=static_cast<float>((snapshot+1)*(i+2))/100.0f;
                assert(tree.getChild(i).getProperty("id").toString()==ids[i]);
                assert(std::abs(static_cast<float>(tree.getChild(i).getProperty("value"))
                       -expected)<0.0001f);
              }
            }
            std::cout<<"JUCE host binary state roundtrip: 5 filter ADSR values restored; invalid chunk rejected\\n";
          }
          CPP
          cmake -S "$RUNNER_TEMP/juce-state-test" -B "$RUNNER_TEMP/juce-state-test/build" \
            -G Xcode -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build "$RUNNER_TEMP/juce-state-test/build" --config Release --parallel 3
          "$RUNNER_TEMP/juce-state-test/build/FreedomStateRoundtrip_artefacts/Release/FreedomStateRoundtrip"
