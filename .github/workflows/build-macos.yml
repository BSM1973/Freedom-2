            -DCMAKE_CXX_FLAGS="-DJUCE_FORCE_USE_LEGACY_PARAM_IDS=1"
      - name: Build AU VST3 Standalone
        shell: bash
        run: cmake --build "$RUNNER_TEMP/freedom-build" --config Release --parallel 3
      - name: Verify compiled AU VST3 filter ADSR parameter identifiers
        shell: bash
        run: |
          set -euo pipefail
          for extension in component vst3; do
            bundle=$(find "$RUNNER_TEMP/freedom-build" -type d -name "Freedom 2.$extension" -print -quit)
            test -n "$bundle"
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            test -f "$binary"
            strings "$binary" > "$RUNNER_TEMP/freedom-$extension-strings.txt"
            for parameter in filterEnvAttack filterEnvDecay filterEnvSustain filterEnvRelease filterEnvAmount; do
              if ! grep -Fq "$parameter" "$RUNNER_TEMP/freedom-$extension-strings.txt"; then
                echo "::error::Missing $parameter in compiled $extension plugin"
                exit 1
              fi
            done
            echo "$extension: five native filter ADSR parameter identifiers present in compiled binary"
          done
      - name: Verify compiled AU instrument metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find "$RUNNER_TEMP/freedom-build" -type d -name 'Freedom 2.component' -print -quit)
          test -n "$bundle"
          plist="$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist" | grep -Fx 'aumu'
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist"
      - name: Collect plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$RUNNER_TEMP/freedom-build" -type d \( -name 'Freedom 2.component' -o -name 'Freedom 2.vst3' -o -name 'Freedom 2.app' \) -prune -print | while IFS= read -r item; do
            cp -R "$item" dist/
          done
          ls -lah dist
          test -d "dist/Freedom 2.component"
          test -d "dist/Freedom 2.vst3"
          for item in dist/*; do codesign --force --deep --sign - "$item"; done
          # Validate both plugin bundles before publishing the artifact.
          for bundle in "dist/Freedom 2.component" "dist/Freedom 2.vst3"; do
            test -f "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$bundle/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            test -f "$bundle/Contents/MacOS/$executable"
            file "$bundle/Contents/MacOS/$executable" | grep -q 'arm64'
          done
          # Both distribution formats must expose a stable, non-empty bundle ID.
          au_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'dist/Freedom 2.component/Contents/Info.plist')
          vst_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'dist/Freedom 2.vst3/Contents/Info.plist')
          test -n "$au_id"
          test -n "$vst_id"
          # JUCE may use the same CFBundleIdentifier for AU and VST3; both must be present.
          echo "AU bundle ID: $au_id"
          echo "VST3 bundle ID: $vst_id"
          # Both installed formats must report the same product version.
          au_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Freedom 2.component/Contents/Info.plist')
          vst_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Freedom 2.vst3/Contents/Info.plist')
          test -n "$au_version"
          test "$au_version" = "$vst_version"
          echo "AU/VST3 shared version: $au_version"
          # JUCE must advertise this plugin as an instrument accepting host MIDI.
          grep -Eq 'IS_SYNTH[[:space:]]+TRUE' "$SOURCE_ROOT/plugin/CMakeLists.txt"
          grep -Eq 'NEEDS_MIDI_INPUT[[:space:]]+TRUE' "$SOURCE_ROOT/plugin/CMakeLists.txt"
          echo "AU/VST3 signatures, ARM64 binaries and native MIDI flags validated"
          ditto -c -k --sequesterRsrc --keepParent dist Freedom-2-macOS-ARM64.zip
          # Verify the published ZIP can be read and contains both plugin formats.
          unzip -tq Freedom-2-macOS-ARM64.zip
          unzip -Z1 Freedom-2-macOS-ARM64.zip | grep -Fq 'Freedom 2.component/Contents/Info.plist'
          unzip -Z1 Freedom-2-macOS-ARM64.zip | grep -Fq 'Freedom 2.vst3/Contents/Info.plist'
          echo "Distribution ZIP integrity and AU/VST3 contents verified"
          # Round-trip the archive and compare the actual bundle metadata byte-for-byte.
          mkdir -p "$RUNNER_TEMP/freedom-zip-check"
          ditto -x -k Freedom-2-macOS-ARM64.zip "$RUNNER_TEMP/freedom-zip-check"
          for format in component vst3; do
            original="dist/Freedom 2.$format/Contents/Info.plist"
            restored="$RUNNER_TEMP/freedom-zip-check/dist/Freedom 2.$format/Contents/Info.plist"
            test -f "$restored"
            cmp "$original" "$restored"
          done
          echo "Distribution ZIP extraction and AU/VST3 plist round-trip verified"
          # Confirm the extracted bundles contain real, nonempty Mach-O binaries.
          for format in component vst3; do
            bundle="$RUNNER_TEMP/freedom-zip-check/dist/Freedom 2.$format"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            test -s "$binary"
            file "$binary" | grep -q 'Mach-O'
            # The macOS ARM64 release must include an Apple Silicon slice.
            lipo "$binary" -verify_arch arm64
            original_binary="dist/Freedom 2.$format/Contents/MacOS/$executable"
            cmp "$original_binary" "$binary"
            # The delivered bundle must retain a valid macOS code signature.
            codesign --verify --strict "$bundle"
            # Confirm the extracted executable is covered by the bundle signature.
            codesign --verify --strict --verbose=2 "$binary"
          done
          echo "Extracted AU and VST3 executables verified"
      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-2-macOS-ARM64
          path: Freedom-2-macOS-ARM64.zip
          retention-days: 7
